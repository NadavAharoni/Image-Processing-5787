<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Segoe UI, Arial, sans-serif" font-size="16">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <!-- Python list -->
  <text x="20" y="28" font-size="19" font-weight="bold">Python list [200, 120, 30, 7]</text>
  <g transform="translate(20,45)">
    <rect width="240" height="40" fill="#eee" stroke="#555"/>
    <g stroke="#555"><line x1="60" y1="0" x2="60" y2="40"/><line x1="120" y1="0" x2="120" y2="40"/><line x1="180" y1="0" x2="180" y2="40"/></g>
    <g fill="#555"><circle cx="30" cy="20" r="4"/><circle cx="90" cy="20" r="4"/><circle cx="150" cy="20" r="4"/><circle cx="210" cy="20" r="4"/></g>
    <text x="255" y="26" font-size="14" fill="#555">8-byte pointers</text>
    <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)">
      <path d="M30,24 L40,120"/><path d="M90,24 L190,120"/><path d="M150,24 L340,120"/><path d="M210,24 L490,120"/>
    </g>
    <g font-family="Consolas, monospace">
      <rect x="0" y="122" width="110" height="56" rx="6" fill="#fff3d6" stroke="#b07a00"/>
      <text x="55" y="145" text-anchor="middle" font-size="13">int object</text><text x="55" y="167" text-anchor="middle">200</text>
      <rect x="150" y="122" width="110" height="56" rx="6" fill="#fff3d6" stroke="#b07a00"/>
      <text x="205" y="145" text-anchor="middle" font-size="13">int object</text><text x="205" y="167" text-anchor="middle">120</text>
      <rect x="300" y="122" width="110" height="56" rx="6" fill="#fff3d6" stroke="#b07a00"/>
      <text x="355" y="145" text-anchor="middle" font-size="13">int object</text><text x="355" y="167" text-anchor="middle">30</text>
      <rect x="450" y="122" width="110" height="56" rx="6" fill="#fff3d6" stroke="#b07a00"/>
      <text x="505" y="145" text-anchor="middle" font-size="13">int object</text><text x="505" y="167" text-anchor="middle">7</text>
    </g>
    <text x="590" y="145" font-size="14" fill="#555">~28 bytes each,</text>
    <text x="590" y="165" font-size="14" fill="#555">anywhere in memory</text>
  </g>
  <!-- NumPy array -->
  <text x="20" y="268" font-size="19" font-weight="bold">np.array([200, 120, 30, 7], dtype=np.uint8)</text>
  <g transform="translate(20,282)" font-family="Consolas, monospace">
    <rect width="60" height="36" fill="#dbe7ff" stroke="#2050c0"/><text x="30" y="24" text-anchor="middle">200</text>
    <rect x="60" width="60" height="36" fill="#dbe7ff" stroke="#2050c0"/><text x="90" y="24" text-anchor="middle">120</text>
    <rect x="120" width="60" height="36" fill="#dbe7ff" stroke="#2050c0"/><text x="150" y="24" text-anchor="middle">30</text>
    <rect x="180" width="60" height="36" fill="#dbe7ff" stroke="#2050c0"/><text x="210" y="24" text-anchor="middle">7</text>
    <text x="260" y="24" font-family="Segoe UI, Arial, sans-serif" fill="#555">4 bytes in one block, all the same type</text>
  </g>
</svg>
