# Defaults for rendering the .md files in this repo with Quarto.
# Render one file:  quarto render exercises.md   /   quarto render slides/image-processing-slides.md
# The files keep the .md suffix so they also read well on GitHub.
project:
  type: default

# Hebrew, right to left, unless a file says otherwise (the slides set lang: en, dir: ltr).
# he-IL, not he: with the bare tag pandoc's Word output loses the Hebrew font (see ../QuartoTools,
# upstream/pandoc-issue-lang-bidi.md). HTML does not care, but the tag is right for both.
lang: he-IL
dir: rtl

# Keep quotes as typed: smart quotes are wrong in Hebrew.
from: markdown-smart

# HTML (exercises.md). The slides set format: revealjs, so none of this applies to them.
format:
  html:
    pagetitle: "עיבוד תמונה – תרגילים"
    css: exercises.css
    embed-resources: false   # GitHub Pages: small HTML + a libraries folder that rarely changes; images stay in images/
    # The file's only '#' heading becomes the page title; '##' sections become the TOC's top level
    shift-heading-level-by: -1
    toc: true
    toc-depth: 2           # sections and exercises (after the shift)
    toc-expand: true       # show every exercise, not only the section being read
    toc-location: left       # Quarto mirrors the layout in RTL: "left" puts the TOC on the right
    grid:
      sidebar-width: 300px   # the TOC (default 250px): exercise titles are long
      body-width: 860px      # the default (~650px) makes code blocks with comments scroll
      margin-width: 20px     # the margin column (on the left in RTL) is empty here
    toc-title: "תוכן עניינים"
    number-sections: false
    highlight-style: github
    code-copy: true
